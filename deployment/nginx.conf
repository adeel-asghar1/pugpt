# PUGPT — proposed Nginx configuration (static frontend + reverse proxy).
#
# This file is a TEMPLATE. It is NOT active on your host and NOT tested on
# any running Nginx. Before enabling:
#   1. Replace <DEPLOYMENT_FQDN> with your domain (a real value; keep quotes sane).
#   2. Replace <DEPLOYMENT_ROOT> with the absolute path to the app (e.g. /opt/pugpt).
#   3. Issue certificates (see deployment.md) and point ssl_certificate paths there.
#   4. Validate with: nginx -t
#   5. Reload with:   systemctl reload nginx   (never nginx -s reload blindly)
#
# Same-origin design: this Nginx serves the built frontend AND proxies /api/*
# to the FastAPI backend on 127.0.0.1:8000. The browser therefore never makes
# cross-origin requests — CORS_ORIGINS becomes irrelevant in this mode.
#
# NOTHING here lets clients reach FastAPI (8000) or Ollama (11434) directly.
# Both listen on 127.0.0.1 only, and the firewall must not expose them.

# ---------------------------------------------------------------------------
# Edge rate limiting (second layer; the in-app limiter is the primary gate).
# Sized for a university crowd sharing NAT addresses (e.g., CS labs): this is
# deliberately GENEROUS — it sheds only floods, never normal per-student use.
# Per-student reality: ~1-5 chat requests/minute → 240r/m per NAT address
# with a 120-request burst absorbs whole classes behind one NAT IP.
# If your deployment is NOT behind a university NAT, you may tighten to:
#   rate=30r/m burst=20   (still far above single-student usage)
# If abuse appears, prefer tightening this zone over touching app code.
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=pugpt_api:10m rate=240r/m;

# Optional but recommended: cache keys to reject header smuggling attempts.
# (Nginx ignores malformed X-Forwarded-* by default in recent versions.)

server {
    listen 80;
    listen [::]:80;
    server_name <DEPLOYMENT_FQDN>;

    # HTTP -> HTTPS redirect. certbot (or your ACME client) manages the cert.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <DEPLOYMENT_FQDN>;

    # --- TLS (replace with YOUR certificate paths; do not invent real ones) ---
    # Example (Let's Encrypt / certbot):
    #   ssl_certificate     /etc/letsencrypt/live/<DEPLOYMENT_FQDN>/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/<DEPLOYMENT_FQDN>/privkey.pem;
    # Any working TLS setup is acceptable. Test before reload.
    ssl_certificate     /etc/letsencrypt/live/<DEPLOYMENT_FQDN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DEPLOYMENT_FQDN>/privkey.pem;

    ssl_session_timeout    1d;
    ssl_session_cache      shared:SSL:50m;
    ssl_protocols          TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # --- Security headers ---
    add_header X-Content-Type-Options  nosniff                 always;
    add_header X-Frame-Options         SAMEORIGIN              always;
    add_header Referrer-Policy         strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000"     always;
    server_tokens off;

    # --- Static frontend (Vite build output) ---
    root <DEPLOYMENT_ROOT>/frontend/dist;
    index index.html;

    # Long cache for fingerprinted assets; never cache index.html.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: unknown non-/api paths -> index.html (React routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API reverse proxy to FastAPI (127.0.0.1:8000) ---
    # Health probes stay CHEAP and never edge-limited: monitors must always
    # see them, even for hosts hammering /api/chat.
    location = /api/health {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection         "";
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/ {
        # Preserve the forwarding chain faithfully; $proxy_add_x_forwarded_for
        # APPENDS this connection's peer IP, so the RIGHTMOST entry seen by the
        # app remains the address THIS Nginx observed. The app trusts only the
        # rightmost entry when RATE_LIMIT_TRUST_PROXY=true (see below).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection         "";
        proxy_http_version 1.1;

        proxy_pass http://127.0.0.1:8000;

        # Groq answers can take 30–90 seconds; do not let Nginx cut them off.
        proxy_read_timeout    180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;

        client_max_body_size 16k;   # one small JSON question; blocks bloated POSTs

        # Edge rate limiting for chat only (protects app/SQLite/Groq under floods).
        limit_req zone=pugpt_api burst=120 nodelay;
        limit_req_status 429;
    }

    # Blocking direct access to backend ports from clients — nothing to route.
    # (Documented for clarity; the FastAPI and Ollama ports are never in a
    # listen directive anywhere in this file.)
}
